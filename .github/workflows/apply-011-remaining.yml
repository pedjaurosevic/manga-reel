name: Apply 0.1.1 remaining upload
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit remaining 0.1.1 files
        run: |
          set -euo pipefail
          test -d .agent-upload
          cat .agent-upload/011-remaining.*.b64 | tr -d '\n' | base64 -d > /tmp/rem.tar.gz
          tar -xzf /tmp/rem.tar.gz
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/ui/library_window.rs src/paper.rs src/archive.rs Cargo.lock
          git status
          git diff --cached --stat
          git commit -m "Release Manga Reel 0.1.1: cover library, paper chrome notes, Cargo.lock" || echo "nothing to commit"
          git push origin HEAD:main
          # cleanup upload staging
          git rm -rf .agent-upload || true
          git commit -m "chore: remove 0.1.1 agent-upload staging" || true
          git push origin HEAD:main || true
