name: Apply 0.1.1 remaining upload
on:
  workflow_dispatch:
  push:
    paths:
      - '.agent-upload/011-remaining.*.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit remaining 0.1.1 files
        run: |
          set -euo pipefail
          cat .agent-upload/011-remaining.*.b64 | base64 -d > /tmp/rem.tar.gz
          tar -xzf /tmp/rem.tar.gz
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status
          git diff --cached --stat
          git commit -m "Release Manga Reel 0.1.1: reader black letterbox, cover library, remaining files" || echo "nothing"
          git push origin HEAD:main
